<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Bird</title>
<style>
html,body{margin:0;height:100%;background:#16384f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 400, H = 600, GH = 90, PW = 66, BX = 110, R = 12;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

let best = 0;
try { best = +localStorage.getItem('flappy_best') || 0; } catch (e) {}

const rand = (a, b) => a + Math.random() * (b - a);
let state = 'start', bird, pipes, score, time, speed, groundX = 0, nextGap, overAt = 0, newBest = false;
const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 90, y: rand(40, 260), s: rand(.6, 1.3), v: rand(.1, .3) }));

function reset() {
  bird = { y: 280, vy: 0, rot: 0, flap: 0 };
  pipes = []; score = 0; time = 0; speed = 2.4; nextGap = 0; newBest = false;
}
reset();

function flap() { bird.vy = -7.6; bird.flap = 1; }
function action() {
  if (state === 'start') { state = 'play'; flap(); }
  else if (state === 'play') flap();
  else if (performance.now() - overAt > 500) { reset(); state = 'play'; flap(); }
}
function die() {
  state = 'over'; overAt = performance.now();
  if (score > best) {
    best = score; newBest = true;
    try { localStorage.setItem('flappy_best', best); } catch (e) {}
  }
}
addEventListener('pointerdown', e => { e.preventDefault(); action(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) action(); }
});

function update(dt, t) {
  clouds.forEach(c => { c.x -= c.v * dt; if (c.x < -120) { c.x = W + 40; c.y = rand(40, 260); } });
  if (state !== 'over') groundX = (groundX - (state === 'play' ? speed : 2) * dt) % 40;
  bird.flap = Math.max(0, bird.flap - .06 * dt);

  if (state === 'start') { bird.y = 280 + Math.sin(t / 250) * 9; bird.rot = 0; return; }

  bird.vy = Math.min(bird.vy + .42 * dt, 11);
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-.45, Math.min(bird.vy * .09, 1.35));
  if (bird.y < R) { bird.y = R; bird.vy = 0; }
  if (bird.y + R >= H - GH) { bird.y = H - GH - R; if (state === 'play') die(); return; }
  if (state === 'over') return;

  time += dt / 60;
  speed = Math.min(2.4 + time * .035, 5.6);
  pipes.forEach(p => p.x -= speed * dt);
  const last = pipes[pipes.length - 1];
  if (!last || last.x < W - nextGap) {
    const gap = rand(135, 172);
    pipes.push({ x: W + 20, gap, top: rand(70, H - GH - gap - 70), done: false });
    nextGap = rand(210, 290);
  }
  pipes = pipes.filter(p => p.x > -PW - 10);
  for (const p of pipes) {
    if (!p.done && p.x + PW < BX - R) { p.done = true; score++; }
    if (BX + R > p.x && BX - R < p.x + PW && (bird.y - R < p.top || bird.y + R > p.top + p.gap)) { die(); break; }
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, fill = '#fff', stroke = '#1d3b53') {
  ctx.font = `800 ${size}px "Trebuchet MS", "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4fc3f7'); g.addColorStop(.7, '#b8ecff'); g.addColorStop(1, '#fff3c4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#9fe0b8';
  [[60, 80], [210, 110], [350, 70]].forEach(([x, r]) => { ctx.beginPath(); ctx.arc(x, H - GH + 30, r, Math.PI, 0); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  clouds.forEach(c => {
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.arc(28, -10, 28, 0, 7); ctx.arc(58, 0, 22, 0, 7); ctx.fill();
    ctx.fillRect(0, 0, 58, 22); ctx.restore();
  });
}
function drawPipe(x, y, h, capTop) {
  const g = ctx.createLinearGradient(x, 0, x + PW, 0);
  g.addColorStop(0, '#2e9e4f'); g.addColorStop(.35, '#7ddc6b'); g.addColorStop(1, '#238a43');
  ctx.fillStyle = g; ctx.strokeStyle = '#17653a'; ctx.lineWidth = 3;
  ctx.fillRect(x + 4, y, PW - 8, h); ctx.strokeRect(x + 4, y, PW - 8, h);
  const cy = capTop ? y : y + h - 28;
  rr(x - 3, cy, PW + 6, 28, 6); ctx.fill(); ctx.stroke();
}
function drawGround() {
  ctx.fillStyle = '#d9c27a'; ctx.fillRect(0, H - GH, W, GH);
  ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, H - GH, W, 18);
  ctx.fillStyle = '#4ea337';
  for (let x = groundX - 40; x < W + 40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, H - GH); ctx.lineTo(x + 20, H - GH); ctx.lineTo(x + 40, H - GH + 18); ctx.lineTo(x + 20, H - GH + 18); ctx.fill();
  }
  ctx.fillStyle = '#17653a'; ctx.fillRect(0, H - GH + 18, W, 3);
}
function drawBird() {
  ctx.save(); ctx.translate(BX, bird.y); ctx.rotate(bird.rot);
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b5791a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 19, 15, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff1b0'; ctx.beginPath(); ctx.ellipse(-2, 6, 11, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.ellipse(-8, 2 - bird.flap * 7, 9, 6, -.3 - bird.flap * .6, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -5, 6, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(10, -5, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff5d3a'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(27, 3); ctx.lineTo(15, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawOver() {
  ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff8e1'; ctx.strokeStyle = '#1d3b53'; ctx.lineWidth = 4;
  rr(50, 150, 300, 290, 22); ctx.fill(); ctx.stroke();
  text('Game Over', 200, 210, 40, '#ff5d3a');
  ctx.fillStyle = '#1d3b53'; ctx.font = '700 20px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Điểm', 125, 262); ctx.fillText('Kỷ lục', 275, 262);
  text(score, 125, 312, 46); text(best, 275, 312, 46, newBest ? '#ffd23f' : '#fff');
  if (newBest) text('Kỷ lục mới!', 200, 350, 22, '#ffd23f');
  ctx.fillStyle = '#35b653'; rr(110, 372, 180, 50, 25); ctx.fill(); ctx.stroke();
  text('Chơi lại', 200, 406, 26);
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawSky();
  pipes.forEach(p => { drawPipe(p.x, -4, p.top + 4, false); drawPipe(p.x, p.top + p.gap, H - GH - p.top - p.gap, true); });
  drawGround(); drawBird();
  if (state === 'play') text(score, W / 2, 90, 64);
  if (state === 'start') {
    text('Flappy Bird', W / 2, 150, 48);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(70, 360, 260, 76, 18); ctx.fill();
    ctx.fillStyle = '#1d3b53'; ctx.font = '700 19px "Trebuchet MS", system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Bấm Space hoặc Click để nhảy', W / 2, 392);
    ctx.fillText('Điện thoại: chạm vào màn hình', W / 2, 420);
    if (best) text('Kỷ lục: ' + best, W / 2, 490, 24);
  }
  if (state === 'over') drawOver();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 16.667, 2.5); last = t;
  update(dt, t); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
